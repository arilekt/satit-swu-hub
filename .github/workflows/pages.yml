# Deploys the site to GitHub Pages and stamps the exact commit into js/build-info.js,
# so the login page shows which commit is really live. Needs Settings → Pages → Source: GitHub Actions.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp commit
        run: sed -i "s/__COMMIT_SHA__/${GITHUB_SHA::7}/" js/build-info.js
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir _site
          tar --exclude=.git --exclude=_site --exclude=.github -cf - . | tar -xf - -C _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
